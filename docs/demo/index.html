<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ferngrove Coffee</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #17181c; background: #fbfaf8; }
      main { max-width: 620px; padding: 64px 32px; }
      h1 { font-size: 30px; letter-spacing: -0.02em; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.6; color: #5d6070; margin: 0 0 28px; max-width: 46ch; }
      .card { display: flex; gap: 24px; align-items: center; border: 1px solid #e6e3dd; border-radius: 14px; padding: 22px; background: #fff; }
      .card h2 { font-size: 15px; margin: 0 0 6px; }
      .card p { font-size: 13px; margin: 0; }
      img { display: block; width: 130px; height: 130px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ferngrove Coffee</h1>
      <p>Open from seven. The spring menu changes every Tuesday, so it lives online rather than on the wall.</p>
      <div class="card">
        <img src="menu.png" width="130" height="130" alt="QR code linking to the spring menu">
        <div>
          <h2>This week's menu</h2>
          <p>Scan for the full list, including the single-origin pour-overs.</p>
        </div>
      </div>
    </main>
  </body>
</html>
